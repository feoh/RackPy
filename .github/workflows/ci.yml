    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
      - run: brew install ninja jq
      - name: Install compiler cache
        run: brew install ccache
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/rackpy/sdk
            ~/.cache/rackpy/build-inputs
          key: rackpy-${{ matrix.platform }}-inputs-${{ hashFiles('upstream/versions.json', 'packaging/inputs.json') }}
      - run: uv sync --frozen
      # The synthetic checker mutation suites run once in the Linux unit job; real Rack tests stay on each target.
      # The compiler cache covers only the tests' own builds, never a release candidate; fast and full runs share it.
      - name: Restore compiler cache (macOS host test builds)
        id: ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/rackpy-ccache
          key: rackpy-ccache-fast-${{ matrix.platform }}-v1-${{ github.sha }}
          restore-keys: rackpy-ccache-fast-${{ matrix.platform }}-v1-
      - name: Fast production-host smoke (not release evidence)
        if: inputs.fast == true && matrix.suite.name == 'app'
        env:
          RACKPY_TEST_EVIDENCE: ""
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_DIR: ${{ runner.temp }}/rackpy-ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_COMPILERCHECK: content
          CCACHE_MAXSIZE: 800M
          RACKPY_MACOS_SOFTWARE_GL: "1"
          PYTHONUNBUFFERED: "1"
        run: >
          uv run --frozen pytest -m "host and not dist and not sanitizer and not stress" -v -s
          --basetemp="$RUNNER_TEMP/pytest" --junitxml=reports/${{ matrix.platform }}.xml
          tests/hardening/test_security.py
          tests/examples/test_oscillator.py::test_the_plugin_loads_under_its_own_slug_and_keeps_its_patch
      - name: Unit, native and Rack host tests
        if: inputs.fast != true
        env:
          MACOS_TESTS: ${{ inputs.macos_tests }}  # through the environment, never into the script's text
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_DIR: ${{ runner.temp }}/rackpy-ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_COMPILERCHECK: content
          CCACHE_MAXSIZE: 800M
          # GitHub-hosted macOS runners have no GPU, and Rack's GLFW asks only for accelerated pixel formats
          # (GLFW 65545). A test-only plugin lets Rack's window use Apple's software OpenGL instead, as Linux CI
          # renders with Mesa (tests/fixtures/macos-software-gl, RP-42). Drawing on a Mac's GPU stays an open gate.
          RACKPY_MACOS_SOFTWARE_GL: "1"
          PYTHONUNBUFFERED: "1"  # show the current test in the live job log
        run: |
          mkdir -p reports
          printf '%s' "$MACOS_TESTS" > reports/selection.txt
          uv run --frozen pytest -m "(unit or native or host) and not dist and not sanitizer and not stress and not inventory" \
            ${MACOS_TESTS:+-k "$MACOS_TESTS"} \
            --ignore=tests/coverage/test_mutations.py --ignore=tests/coverage/test_release_mutations.py \
            -v -s -o faulthandler_timeout=120 --basetemp="$RUNNER_TEMP/pytest" --junitxml=reports/${{ matrix.platform }}.xml \
            ${{ matrix.suite.paths }}
      - name: Compiler cache statistics
        if: always()
        env:
          CCACHE_DIR: ${{ runner.temp }}/rackpy-ccache
        run: ccache --show-stats
      # Saved when a test fails too: a failing branch's next run should not compile the same files again.
      - name: Save compiler cache
        if: always() && steps.ccache.outputs.cache-primary-key != '' && steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/rackpy-ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}
      - if: always()
        name: Collect Rack logs
        run: |
          mkdir -p reports/rack-logs
          cd "$RUNNER_TEMP/pytest" 2>/dev/null && find . -name log.txt -exec rsync -R {} "$GITHUB_WORKSPACE/reports/rack-logs/" \; || true
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-${{ matrix.platform }}-${{ matrix.suite.name }}-reports
          path: reports/
          retention-days: 14
          if-no-files-found: ignore

  compiler-caches:
    name: Keep one compiler cache per platform on this branch
    # Every run saves its compiler caches under its commit, about 2.5 GB a commit. Left alone they pass the
    # repository's 10 GB limit within four commits and GitHub evicts the least recently used, which were main's:
    # the ones a new branch's first run starts from (a cold run compiles for 40 to 70 minutes). This deletes
    # all but the newest per platform on the run's own branch; other branches and main are not touched.
    # A fork's token cannot delete caches.
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    needs: [native, host, windows, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true  # housekeeping: a failure here says nothing about the commit
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" --key rackpy-ccache- --limit 100 --json id,key,createdAt \
            --jq 'group_by(.key | sub("-[0-9a-f]{40}$"; "")) | map(sort_by(.createdAt) | .[:-1][]) | .[] | "\(.id) \(.key)"' |
          while read -r id key; do
            echo "deleting $key"
            gh cache delete "$id" -R "$GITHUB_REPOSITORY"
          done
