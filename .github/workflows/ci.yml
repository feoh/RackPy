# SPDX-License-Identifier: GPL-3.0-or-later
# RackPy CI (RP-08): Linux x86_64, macOS arm64 and x86_64, Windows x86_64 (RP-40, RP-41).
#
# How much runs depends on what started it (RP-56; CONTRIBUTING.md has the table):
#   pull request                 Linux checks and a fast host smoke
#   dispatch, fast=true          the same, plus that smoke on macOS and Windows
#   dispatch                     every test suite on the four platforms
#   dispatch, candidates=true    the tests, the distributable build, the release candidates and the
#   and every push to main       per-platform SDK inventory
#
# Every input is pinned and checksum-verified by the bin/ tools, so the caches
# below only save downloads. CI keeps logs and test reports, never binaries:
# distributing a build needs owner approval (RP-44).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      fast:
        description: "Fast feedback only: representative production-host checks, no release candidates"
        required: false
        type: boolean
        default: false
      candidates:
        description: "Also build the distributable and every release candidate (30 to 50 more minutes; release evidence needs it)"
        required: false
        type: boolean
        default: false
      macos_tests:
        description: "Optional pytest -k expression for the macOS host-test jobs (empty: all of them)"
        required: false
        default: ""
      windows_tests:
        description: "Optional pytest -k expression for the Windows host-test job (empty: all of them)"
        required: false
        default: ""
  schedule:
    - cron: "17 6 * * 1"  # weekly: external links, and a fresh look at the pinned downloads

permissions:
  contents: read

# A newer push to a pull request cancels its older run, and so does a newer dispatch on the same branch with
# the same inputs: a superseded run otherwise holds macOS runners (five at a time) that the new one waits for.
# Every commit on main, and every dispatch with candidates, keeps its own complete run, so evidence for a
# commit is never cancelled by a later one.
concurrency:
  group: >-
    ci-${{ (github.event_name == 'push' || inputs.candidates == true) && github.sha
    || format('{0}-{1}-{2}-{3}', github.ref, inputs.fast, inputs.macos_tests, inputs.windows_tests) }}
  cancel-in-progress: true

# A -m on the command line replaces pyproject's addopts -m, so every selection below repeats
# "not sanitizer and not stress": those suites are opt-in (RP-38) and take hours here.
env:
  UV_VERSION: "0.9.18"
  # Missing tools or inputs fail tests (tests/support.py); jobs list what they deliberately lack.
  RACKPY_ALLOW_MISSING: ""
  # A stalled mirror connection once held apt-get update for a job's whole 30 minutes: give up and retry.
  APT_OPTS: -o Acquire::Retries=3 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60
  # Every test's outcome, outside Rack and inside it, per platform (tests/support.py), uploaded with each job's
  # reports: the per-platform evidence `bin/check_coverage.py evidence` and `release --evidence` read (RP-42).
  RACKPY_TEST_EVIDENCE: ${{ github.workspace }}/reports/evidence

jobs:
  planning:
    name: Planning data
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          # The Ubuntu runner has no Python 3.14, so uv installs its own: a 34 MiB download from a GitHub
          # release in every Linux job, and one HTTP 500 there failed two jobs of a run (RP-61). The Linux
          # jobs keep it in the Actions cache instead. macOS and Windows use the runner's own Python.
          cache-python: true
      - run: bin/planning-check
      - run: bin/callback-matrix check

  python:
    name: Hooks, typing and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          cache-python: true  # RP-61, as in the planning job
      - run: uv sync --frozen
      - name: prek (ruff, strict mypy, JSON/YAML, planning, callback matrix)
        run: uvx prek@0.5.3 run --all-files --show-diff-on-failure
      - name: Binding manifest consistency and generated files (names are checked against the built package in the host job)
        run: bin/check_coverage.py check --without-built-package && bin/generate_bindings.py check
      - run: uv run --frozen pytest -m unit --junitxml=reports/unit.xml
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-reports
          path: reports/
          retention-days: 14
          if-no-files-found: ignore

  docs:
    name: Documentation site (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Every shard that builds a site takes about two minutes, so each one gets its own runner. The site-build
        # shard only builds and keeps the HTML; an empty selection skips pytest. The selections partition the
        # docs tests: each runs in exactly one shard (checked when this list changes).
        include:
          - shard: site-build
            selection: ""
          - shard: site-tests
            selection: "not test_mistakes_fail_the_build and not test_conceptual_code_is_labelled_and_accepted"
          - shard: conceptual-code
            selection: "test_conceptual_code_is_labelled_and_accepted"
          - shard: broken-page
            selection: "test_mistakes_fail_the_build and page"
          - shard: broken-anchor
            selection: "test_mistakes_fail_the_build and anchor"
          - shard: broken-repository-file
            selection: "test_mistakes_fail_the_build and repository-file"
          - shard: broken-unlabelled-python
            selection: "test_mistakes_fail_the_build and unlabelled-python"
          - shard: broken-missing-snippet
            selection: "test_mistakes_fail_the_build and missing-snippet"
          - shard: broken-image-alt
            selection: "test_mistakes_fail_the_build and image-alt"
          - shard: broken-missing-example
            selection: "test_mistakes_fail_the_build and missing-example"
          - shard: broken-missing-object
            selection: "test_mistakes_fail_the_build and missing-object"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          cache-python: true  # RP-61, as in the planning job
      - run: uv sync --frozen
      - name: Build with warnings as errors (pages, anchors, repository links, labelled code, alt text)
        if: matrix.shard == 'site-build'
        run: uv run --frozen sphinx-build -W --keep-going -n -b html docs build/docs/html
      - name: Docs checks and runs-in=python snippets (runs-in=rack snippets run in the host job)
        if: matrix.selection != ''
        env:
          DOCS_SELECTION: ${{ matrix.selection }}
        run: uv run --frozen pytest -m "docs and not host and not sanitizer and not stress" -k "$DOCS_SELECTION" -v --junitxml=reports/docs.xml
      - if: always() && matrix.shard == 'site-build'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-html
          path: build/docs/html/
          retention-days: 14
          if-no-files-found: ignore
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-reports-${{ matrix.shard }}
          path: reports/
          retention-days: 14
          if-no-files-found: ignore

  docs-links:
    name: Documentation external links
    # External sites must not block fast feedback; run weekly and on ordinary dispatch.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.fast != true)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          cache-python: true  # RP-61, as in the planning job
      - run: uv sync --frozen
      - run: uv run --frozen sphinx-build -b linkcheck docs build/docs/linkcheck
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-linkcheck
          path: build/docs/linkcheck/output.*
          retention-days: 14
          if-no-files-found: ignore

  native:
    name: SDK pins, native build and audio-path guard
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          cache-python: true  # RP-61, as in the planning job
      - name: Libraries libRack links (native tests run outside Rack)
        run: sudo apt-get $APT_OPTS update && sudo apt-get $APT_OPTS install -y --no-install-recommends ninja-build jq libgl1 libx11-6 libasound2t64 libjack-jackd2-0 libpulse0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/rackpy/sdk
            ~/.cache/rackpy/build-inputs
            ~/.cache/rackpy/spike-inputs
          key: rackpy-inputs-${{ hashFiles('upstream/versions.json', 'packaging/inputs.json', 'spikes/embedding/inputs.json') }}
      - run: uv sync --frozen
      - run: bin/rack-sdk environment
      - name: SDK archives, header trees and libraries match the pins
        run: bin/rack-sdk verify
      - name: rack.hpp include closure matches the fixture
        run: bin/rack-sdk closure
      - name: rack.hpp-only probe builds with the SDK's plugin.mk
        run: bin/rack-sdk probe
      # The compiler cache covers only these test builds (the dev and sanitizer builds, never a release
      # candidate): ccache replays compiler output keyed on the compiler's contents, flags and sources.
      - name: Install compiler cache
        run: sudo apt-get $APT_OPTS install -y --no-install-recommends ccache
      - name: Restore compiler cache (native test builds)
        id: ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/rackpy-native-ccache
          key: rackpy-ccache-fast-native-lin-x64-v1-${{ github.sha }}
          restore-keys: rackpy-ccache-fast-native-lin-x64-v1-
      - name: Native build and audio-path guard (fast cache, not release evidence)
        if: github.event_name == 'pull_request' || inputs.fast == true
        env:
          RACKPY_TEST_EVIDENCE: ""
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_DIR: ${{ runner.temp }}/rackpy-native-ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_COMPILERCHECK: content
          CCACHE_MAXSIZE: 800M
        run: >
          uv run --frozen pytest -m "native and not host and not sanitizer and not stress" -v
          --basetemp="$RUNNER_TEMP/native-pytest" --junitxml=reports/native.xml
      - name: Native build (warnings as errors), CTest, inspection, setup errors, audio-path guard
        if: github.event_name != 'pull_request' && inputs.fast != true
        env:
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_DIR: ${{ runner.temp }}/rackpy-native-ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_COMPILERCHECK: content
          CCACHE_MAXSIZE: 800M
        # The same --basetemp as the fast step: the build tree's path is part of every compile command, so
        # a different one would never hit the other lane's cache.
        run: >
          uv run --frozen pytest -m "native and not host and not sanitizer and not stress" -v
          --basetemp="$RUNNER_TEMP/native-pytest" --junitxml=reports/native.xml
      - name: Native compiler cache statistics
        if: always()
        env:
          CCACHE_DIR: ${{ runner.temp }}/rackpy-native-ccache
          CCACHE_MAXSIZE: 800M
        run: ccache --show-stats
      # Saved when a test fails too: a failing branch's next run should not compile the same files again.
      - name: Save compiler cache
        if: always() && steps.ccache.outputs.cache-primary-key != '' && steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/rackpy-native-ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-reports
          path: reports/
          retention-days: 14
          if-no-files-found: ignore

  inventory:
    name: SDK inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # The committed inventory records the libclang build that produced it
      # (clang 23.1.3 on the planning machine); this LLVM cannot reproduce that
      # record, so only that comparison is skipped here, and visibly.
      RACKPY_ALLOW_MISSING: pinned-libclang
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          cache-python: true  # RP-61, as in the planning job
      # The pinned clang==21.1.7 Python bindings need libclang 21 or newer
      # (clang_getOffsetOfBase); Ubuntu 24.04 ships LLVM 18. apt.llvm.org's
      # LLVM 21 branch moves with point releases, so the job prints the version.
      - name: LLVM 21 from apt.llvm.org
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get $APT_OPTS update && sudo apt-get $APT_OPTS install -y --no-install-recommends clang-21 libclang-21-dev
          echo /usr/lib/llvm-21/bin >> "$GITHUB_PATH"
      - run: clang++ --version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/rackpy/sdk
          key: rackpy-sdk-${{ hashFiles('upstream/versions.json') }}
      - run: uv sync --frozen
      - run: uv run --frozen pytest -m inventory -v --junitxml=reports/inventory.xml
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inventory-reports
          path: reports/
          retention-days: 14
          if-no-files-found: ignore

  inventory-platforms:
    name: SDK inventory on ${{ matrix.platform }}, extracted natively
    # RP-42. The committed inventory's macOS and Windows variants are extracted on Linux with each target's own
    # library headers. This extracts each one again on the platform itself, with that machine's compiler headers
    # (Xcode's SDK; MSYS2's MinGW) and that platform's SDK archive, and fails on any difference.
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.candidates == true && inputs.fast != true)
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: mac-arm64
          - runner: macos-15-intel
            platform: mac-x64
          - runner: windows-2025
            platform: win-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
      # The pinned clang==21.1.7 Python bindings need libclang 21 or newer; Xcode's is older. Homebrew's LLVM
      # moves with releases, so the job prints its version and the SDK's.
      - if: runner.os == 'macOS'
        name: libclang from Homebrew's LLVM, headers from Xcode's SDK
        run: |
          brew install llvm
          prefix="$(brew --prefix llvm)"
          { echo "CLANGXX=$prefix/bin/clang++"; echo "LIBCLANG=$prefix/lib/libclang.dylib"; } >> "$GITHUB_ENV"
          "$prefix/bin/clang++" --version | head -1
          echo "SDK $(xcrun --show-sdk-version): $(xcrun --show-sdk-path)"
      - if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-clang
      - if: runner.os == 'Windows'
        name: libclang and headers from MSYS2's MINGW64 clang
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          echo "$MSYS2_LOCATION\mingw64\bin" >> "$GITHUB_PATH"
          { echo "CLANGXX=$MSYS2_LOCATION\mingw64\bin\clang++.exe"; echo "LIBCLANG=$MSYS2_LOCATION\mingw64\bin\libclang.dll"; } >> "$GITHUB_ENV"
          "$MSYS2_LOCATION/mingw64/bin/clang++" --version | head -1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/rackpy/sdk
          key: rackpy-sdk-${{ matrix.platform }}-${{ hashFiles('upstream/versions.json') }}
      - name: Extract natively and compare with the committed inventory
        env:
          PLATFORM: ${{ matrix.platform }}
        run: uv run --script bin/inventory_sdk.py platform-check "$PLATFORM" --clangxx "$CLANGXX" --libclang "$LIBCLANG"

  host:
    name: Rack host smoke tests (headless and Xvfb, no audio device)
    runs-on: ubuntu-24.04
    # The in-Rack suites grow with each binding family (27.7 minutes at RP-19A); builds are memory-capped too.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          cache-python: true  # RP-61, as in the planning job
      - name: Rack's runtime libraries, Mesa for the Xvfb window, and Xvfb
        run: >
          sudo apt-get $APT_OPTS update && sudo apt-get $APT_OPTS install -y --no-install-recommends ninja-build jq
          libgl1 libgl1-mesa-dri libx11-6 libasound2t64 libjack-jackd2-0 libpulse0 libpulse-mainloop-glib0 xvfb xauth
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/rackpy/sdk
            ~/.cache/rackpy/build-inputs
            ~/.cache/rackpy/spike-inputs
          key: rackpy-host-inputs-${{ hashFiles('upstream/versions.json', 'packaging/inputs.json', 'spikes/embedding/inputs.json') }}
      - run: uv sync --frozen
      # The compiler cache covers only the host tests' own builds (production and test-hooks), never a release
      # candidate. The fast and full suites build the same trees, so they share one cache.
      - name: Install compiler cache
        run: sudo apt-get $APT_OPTS install -y --no-install-recommends ccache
      - name: Restore compiler cache (Linux host test builds)
        id: ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/rackpy-ccache
          key: rackpy-ccache-fast-lin-x64-v1-${{ github.sha }}
          restore-keys: rackpy-ccache-fast-lin-x64-v1-
      - name: Fast production-host smoke (not release evidence)
        if: github.event_name == 'pull_request' || inputs.fast == true
        env:
          RACKPY_TEST_EVIDENCE: ""
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_DIR: ${{ runner.temp }}/rackpy-ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_COMPILERCHECK: content
          CCACHE_MAXSIZE: 800M
        run: >
          uv run --frozen pytest -m "host and not dist and not sanitizer and not stress" -v --basetemp="$RUNNER_TEMP/pytest"
          tests/hardening/test_security.py
          tests/examples/test_oscillator.py::test_the_plugin_loads_under_its_own_slug_and_keeps_its_patch
          --junitxml=reports/host.xml
      - name: Full Rack-host suite
        if: github.event_name != 'pull_request' && inputs.fast != true
        env:
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_DIR: ${{ runner.temp }}/rackpy-ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_COMPILERCHECK: content
          CCACHE_MAXSIZE: 800M
        run: >
          uv run --frozen pytest -m "host and not dist and not sanitizer and not stress" -v --basetemp="$RUNNER_TEMP/pytest"
          --junitxml=reports/host.xml
      - name: Compiler cache statistics
        if: always()
        env:
          CCACHE_DIR: ${{ runner.temp }}/rackpy-ccache
        run: ccache --show-stats
      # Saved when a test fails too: a failing branch's next run should not compile the same files again.
      - name: Save compiler cache
        if: always() && steps.ccache.outputs.cache-primary-key != '' && steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/rackpy-ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}
      - if: always()
        name: Collect Rack logs
        run: |
          mkdir -p reports/rack-logs
          cd "$RUNNER_TEMP/pytest" 2>/dev/null && find . -name log.txt -exec cp --parents {} "$GITHUB_WORKSPACE/reports/rack-logs/" \; || true
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-reports
          path: reports/
          retention-days: 14
          if-no-files-found: ignore

  toolchain:
    name: Official Rack toolchain (cached, or built)
    # Building the toolchain takes about an hour on a cache miss, so the jobs that use it run on main and on
    # demand (candidates), not on every pull request or dispatch. This job only makes sure the cache entry
    # exists (seconds on a hit, without downloading it), so the distributable build and the Linux release
    # candidate can both restore it and run side by side instead of one after the other.
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.candidates == true && inputs.fast != true)
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          cache-python: true  # RP-61, as in the planning job
      - name: Look for the toolchain (a miss saves what the next steps build)
        id: toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/rackpy/toolchain/*/local
          key: rack-toolchain-lin-x64-${{ hashFiles('upstream/versions.json', 'packaging/toolchain/lin-x64.Dockerfile') }}
          lookup-only: true
      - if: steps.toolchain.outputs.cache-hit != 'true'
        run: bin/rack-toolchain build --jobs "$(nproc)"
      - if: steps.toolchain.outputs.cache-hit != 'true'
        run: bin/rack-toolchain check

  dist:
    name: Distributable build with the official Rack toolchain
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.candidates == true && inputs.fast != true)
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          cache-python: true  # RP-61, as in the planning job
      - run: >
          sudo apt-get $APT_OPTS update && sudo apt-get $APT_OPTS install -y --no-install-recommends ninja-build jq
          libgl1 libx11-6 libasound2t64 libjack-jackd2-0 libpulse0
      - name: Restore the toolchain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/rackpy/toolchain/*/local
          key: rack-toolchain-lin-x64-${{ hashFiles('upstream/versions.json', 'packaging/toolchain/lin-x64.Dockerfile') }}
          fail-on-cache-miss: true
      - run: bin/rack-toolchain check
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/rackpy/sdk
            ~/.cache/rackpy/build-inputs
          key: rackpy-dist-inputs-${{ hashFiles('upstream/versions.json', 'packaging/inputs.json') }}
      - run: uv sync --frozen
      - run: uv run --frozen pytest -m dist -v -s --basetemp="$RUNNER_TEMP/pytest" --junitxml=reports/dist.xml
      - if: always()
        name: Collect Rack logs
        run: |
          mkdir -p reports/rack-logs
          cd "$RUNNER_TEMP/pytest" 2>/dev/null && find . -name log.txt -exec cp --parents {} "$GITHUB_WORKSPACE/reports/rack-logs/" \; || true
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-reports
          path: reports/
          retention-days: 14
          if-no-files-found: ignore

  release-candidate:
    name: Linux release candidate, installed and run on a clean machine
    # RP-39. Builds every Linux artifact of this commit with the official toolchain (bin/rackpy-release build),
    # then installs and runs them in clean Ubuntu 20.04 and 16.04 containers with no Python and no network
    # (bin/rackpy-release verify). Keeps the manifest, checksums, logs and screenshots, not the artifacts:
    # nothing is distributed without owner approval.
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.candidates == true && inputs.fast != true)
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          cache-python: true  # RP-61, as in the planning job
      - name: Ninja, jq, and Rack's runtime libraries (for the candidate's introspection, run on this runner)
        run: >
          sudo apt-get $APT_OPTS update && sudo apt-get $APT_OPTS install -y --no-install-recommends ninja-build jq
          libgl1 libx11-6 libasound2t64 libjack-jackd2-0 libpulse0 libpulse-mainloop-glib0
      - name: Restore the toolchain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/rackpy/toolchain/*/local
          key: rack-toolchain-lin-x64-${{ hashFiles('upstream/versions.json', 'packaging/toolchain/lin-x64.Dockerfile') }}
          fail-on-cache-miss: true
      - run: bin/rack-toolchain check
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/rackpy/sdk
            ~/.cache/rackpy/build-inputs
          key: rackpy-release-inputs-${{ hashFiles('upstream/versions.json', 'packaging/inputs.json') }}
      - run: uv sync --frozen
      - name: Build the release candidate
        run: bin/rackpy-release build --dest "$RUNNER_TEMP/release"
      - name: Install and run it on a clean Ubuntu 20.04
        run: >
          bin/rackpy-release verify "$RUNNER_TEMP/release/artifacts" --rack "$(bin/rack-sdk host | tail -1)"
          --logs reports/verify-ubuntu-20.04
      - name: Install and run it on a clean Ubuntu 16.04 (glibc 2.23, the oldest claimed)
        run: >
          bin/rackpy-release verify "$RUNNER_TEMP/release/artifacts" --rack "$(bin/rack-sdk host | tail -1)"
          --logs reports/verify-ubuntu-16.04 --image ubuntu-16.04
      - name: The binding manifest against what the candidate's RackPy exports inside Rack
        run: |
          bin/rackpy-release introspect "$RUNNER_TEMP/release/artifacts" --rack "$(bin/rack-sdk host | tail -1)" \
            --out reports/introspection-lin-x64.json
          uv run bin/check_coverage.py check --introspection reports/introspection-lin-x64.json
      - if: always()
        name: Keep the manifest, checksums and each artifact's file list with the logs
        run: |
          shopt -s nullglob  # a failed build leaves no artifacts; a glob must not become a file name
          mkdir -p reports/files
          cp "$RUNNER_TEMP/release/artifacts/manifest.json" "$RUNNER_TEMP/release/artifacts/SHA256SUMS" reports/ || true
          for d in "$RUNNER_TEMP"/release/work/RackPy "$RUNNER_TEMP"/release/work/plugins/*; do
            cp "$d/licenses/FILES.json" "reports/files/$(basename "$d").json" || true
          done
          mkdir -p reports/listings  # every member's mode, owner, size, date and name
          for f in "$RUNNER_TEMP"/release/artifacts/*.vcvplugin "$RUNNER_TEMP"/release/artifacts/*.tar.zst; do
            tar --zstd -tvf "$f" > "reports/listings/$(basename "$f").txt" || true
          done
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate-evidence
          path: reports/
          retention-days: 30
          if-no-files-found: ignore

  macos-release-candidate:
    name: macOS ${{ matrix.platform }} release candidate, installed and run in fresh Rack user folders
    # RP-40. Builds every macOS artifact of this commit for the runner's architecture with Xcode's AppleClang
    # (bin/rackpy-release build: Mach-O architecture, install names, rpaths, deployment target and signature
    # checked), then installs and runs them in Rack Free 2.6.6 with an empty environment, including the
    # wrong-architecture, unsigned and quarantine cases (bin/rackpy-release verify). A runner is not a clean
    # Mac: the logs record every library Rack mapped. Keeps evidence, not the artifacts.
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.candidates == true && inputs.fast != true)
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: mac-arm64
          - runner: macos-15-intel
            platform: mac-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
      - run: brew install ninja jq
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/rackpy/sdk
            ~/.cache/rackpy/build-inputs
          key: rackpy-${{ matrix.platform }}-release-inputs-${{ hashFiles('upstream/versions.json', 'packaging/inputs.json') }}
      - run: uv sync --frozen
      - name: Build the release candidate
        run: bin/rackpy-release build --dest "$RUNNER_TEMP/release"
      - name: Install and run it in fresh Rack user folders
        run: >
          bin/rackpy-release verify "$RUNNER_TEMP/release/artifacts"
          --rack "$(bin/rack-sdk host mac-x64+arm64 | tail -1)" --logs reports/verify
      - name: The binding manifest against what the candidate's RackPy exports inside Rack
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          bin/rackpy-release introspect "$RUNNER_TEMP/release/artifacts" \
            --rack "$(bin/rack-sdk host mac-x64+arm64 | tail -1)" --out "reports/introspection-$PLATFORM.json"
          uv run bin/check_coverage.py check --introspection "reports/introspection-$PLATFORM.json"
      - if: always()
        name: Keep the manifest, checksums and each artifact's file list with the logs
        run: |
          shopt -s nullglob  # a failed build leaves no artifacts; a glob must not become a file name
          mkdir -p reports/files reports/listings
          cp "$RUNNER_TEMP/release/artifacts/manifest.json" "$RUNNER_TEMP/release/artifacts/SHA256SUMS" reports/ || true
          for d in "$RUNNER_TEMP"/release/work/RackPy "$RUNNER_TEMP"/release/work/plugins/*; do
            cp "$d/licenses/FILES.json" "reports/files/$(basename "$d").json" || true
          done
          for f in "$RUNNER_TEMP"/release/artifacts/*.vcvplugin "$RUNNER_TEMP"/release/artifacts/*.tar.zst; do
            tar -tvf "$f" > "reports/listings/$(basename "$f").txt" || true
          done
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-${{ matrix.platform }}-release-candidate-evidence
          path: reports/
          retention-days: 30
          if-no-files-found: ignore

  windows-release-candidate:
    name: Windows x64 release candidate, installed and run in fresh Rack user folders
    # RP-41. Builds every Windows artifact of this commit with MSYS2's MINGW64 GCC (msvcrt, as Rack) on the
    # runner (bin/rackpy-release build: PE imports and exports checked, no UCRT in RackPy's own DLLs), then
    # installs and runs them in Rack Free 2.6.6 with Windows PowerShell and PATH limited to Windows' folders,
    # including the missing-DLL, damaged-runtime, decoy-DLL, permission, Unicode and long-path cases
    # (bin/rackpy-release verify). A runner is not a clean PC: the logs record every DLL Rack loaded.
    # Keeps evidence, not the artifacts.
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.candidates == true && inputs.fast != true)
    runs-on: windows-2025
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
      - id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja mingw-w64-x86_64-binutils
      - name: MINGW64 tools on PATH
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          echo "$MSYS2_LOCATION\mingw64\bin" >> "$GITHUB_PATH"
          { echo "CC=$MSYS2_LOCATION\mingw64\bin\gcc.exe"; echo "CXX=$MSYS2_LOCATION\mingw64\bin\g++.exe"; } >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/rackpy/sdk
            ~/.cache/rackpy/build-inputs
          key: rackpy-win-x64-release-inputs-${{ hashFiles('upstream/versions.json', 'packaging/inputs.json') }}
      - run: uv sync --frozen
      - name: Build the release candidate
        run: uv run --script bin/rackpy-release build --dest "$RUNNER_TEMP/release"
      - name: Install and run it in fresh Rack user folders
        run: >
          uv run --script bin/rackpy-release verify "$RUNNER_TEMP/release/artifacts"
          --rack "$(uv run --script bin/rack-sdk host win-x64 | tail -1)" --logs reports/verify
      - name: The binding manifest against what the candidate's RackPy exports inside Rack
        run: |
          uv run --script bin/rackpy-release introspect "$RUNNER_TEMP/release/artifacts" \
            --rack "$(uv run --script bin/rack-sdk host win-x64 | tail -1)" --out reports/introspection-win-x64.json
          uv run --script bin/check_coverage.py check --introspection reports/introspection-win-x64.json
      - if: always()
        name: Keep the manifest, checksums and each artifact's file list with the logs
        run: |
          shopt -s nullglob  # a failed build leaves no artifacts; a glob must not become a file name
          mkdir -p reports/files
          cp "$RUNNER_TEMP/release/artifacts/manifest.json" "$RUNNER_TEMP/release/artifacts/SHA256SUMS" reports/ || true
          for d in "$RUNNER_TEMP"/release/work/RackPy "$RUNNER_TEMP"/release/work/plugins/*; do
            cp "$d/licenses/FILES.json" "reports/files/$(basename "$d").json" || true
          done
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-win-x64-release-candidate-evidence
          path: reports/
          retention-days: 30
          if-no-files-found: ignore

  windows:
    name: Windows x64 ${{ matrix.suite.name }} suite, native build, CTest, unit and Rack host tests
    # RP-41. A native build with MSYS2's MINGW64 GCC (mingw-w64, msvcrt: the compiler family and C runtime
    # Rack for Windows is built with), the native tests (CTest, through the dev_build fixture) and the host
    # tests in Rack Free 2.6.6, unpacked from its installer by 7-Zip. The test harness runs on uv's
    # Windows CPython; the plugin embeds the pinned MSVC-built CPython. Linux-only tests skip by platform.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    # Disjoint directory slices run concurrently; app and coverage are isolated because they dominated the prior
    # Windows x64 suite's observed runtime. The report collector merges their evidence by platform.
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite:
              name: app
              paths: tests/app tests/widget tests/ui tests/rendering
          - suite:
              name: coverage
              paths: tests/coverage
          - suite:
              name: dsp
              paths: tests/dsp tests/simd tests/values tests/engine tests/io tests/laboratory
          - suite:
              name: examples
              paths: tests/examples
          - suite:
              name: services
              paths: tests/docs tests/facade tests/hardening tests/history tests/integration tests/native tests/plugin tests/runtime tests/services tests/state tests/trampolines tests/unit
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
      - id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja mingw-w64-x86_64-binutils mingw-w64-x86_64-ccache
      - name: MINGW64 tools on PATH
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          echo "$MSYS2_LOCATION\mingw64\bin" >> "$GITHUB_PATH"
          # The runner also has MSVC and LLVM; Rack's C++ ABI needs MinGW GCC.
          { echo "CC=$MSYS2_LOCATION\mingw64\bin\gcc.exe"; echo "CXX=$MSYS2_LOCATION\mingw64\bin\g++.exe"; } >> "$GITHUB_ENV"
          "$MSYS2_LOCATION/mingw64/bin/g++" --version | head -1
          "$MSYS2_LOCATION/mingw64/bin/g++" -dM -E -x c++ -include stdio.h /dev/null | grep -E "^#define (_UCRT|__MSVCRT__) " || true
          7z | head -2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/rackpy/sdk
            ~/.cache/rackpy/build-inputs
          key: rackpy-win-x64-inputs-${{ hashFiles('upstream/versions.json', 'packaging/inputs.json') }}
      - run: uv sync --frozen
      # GitHub-hosted Windows runners have no GPU, only Windows' OpenGL 1.1, and Rack needs 2.0. Mesa's software
      # OpenGL beside the test copy of Rack renders as Linux CI does under Xvfb (RP-42); it is not a GPU, so
      # drawing on real Windows graphics drivers stays an open gate.
      - name: Mesa's software OpenGL beside the test copy of Rack
        run: uv run --script bin/rack-sdk mesa --into "$(uv run --script bin/rack-sdk host win-x64 | tail -1)"
      # These two synthetic coverage-checker suites run in the Linux unit job, not as platform binding evidence.
      # tests/coverage/test_shared_checks.py prevents their accidental use as per-platform manifest/sample evidence.
      # The compiler cache covers only the tests' own builds, never a release candidate; fast and full runs share it.
      - name: Restore compiler cache (Windows host test builds)
        id: ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/rackpy-ccache
          key: rackpy-ccache-fast-win-x64-v1-${{ github.sha }}
          restore-keys: rackpy-ccache-fast-win-x64-v1-
      - name: Fast production-host smoke (not release evidence)
        if: inputs.fast == true && matrix.suite.name == 'app'
        env:
          RACKPY_TEST_EVIDENCE: ""
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_DIR: ${{ runner.temp }}/rackpy-ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_COMPILERCHECK: content
          CCACHE_MAXSIZE: 800M
          GALLIUM_DRIVER: llvmpipe
          PYTHONUTF8: "1"
          PYTHONUNBUFFERED: "1"
        run: >
          uv run --frozen pytest -m "host and not dist and not sanitizer and not stress" -v -s
          --basetemp="$RUNNER_TEMP/pytest" --junitxml=reports/win-x64.xml
          tests/hardening/test_security.py
          tests/examples/test_oscillator.py::test_the_plugin_loads_under_its_own_slug_and_keeps_its_patch
      - name: Unit, native and Rack host tests
        if: inputs.fast != true
        env:
          WINDOWS_TESTS: ${{ inputs.windows_tests }}  # through the environment, never into the script's text
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_DIR: ${{ runner.temp }}/rackpy-ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_COMPILERCHECK: content
          CCACHE_MAXSIZE: 800M
          GALLIUM_DRIVER: llvmpipe  # Mesa's CPU renderer, not its Direct3D 12 driver
          # The tests read Rack's UTF-8 files with Python's default encoding, which on Windows is the ANSI code
          # page unless Python's UTF-8 mode is on (inside Rack, RackPy turns it on itself).
          PYTHONUTF8: "1"
          PYTHONUNBUFFERED: "1"  # show the current test in the live job log
        run: |
          mkdir -p reports
          printf '%s' "$WINDOWS_TESTS" > reports/selection.txt
          uv run --frozen pytest -m "(unit or native or host) and not dist and not sanitizer and not stress and not inventory" \
            ${WINDOWS_TESTS:+-k "$WINDOWS_TESTS"} \
            --ignore=tests/coverage/test_mutations.py --ignore=tests/coverage/test_release_mutations.py \
            -v -s -o faulthandler_timeout=120 --basetemp="$RUNNER_TEMP/pytest" --junitxml=reports/win-x64.xml \
            ${{ matrix.suite.paths }}
      - name: Compiler cache statistics
        if: always()
        env:
          CCACHE_DIR: ${{ runner.temp }}/rackpy-ccache
        run: ccache --show-stats
      # Saved when a test fails too: a failing branch's next run should not compile the same files again.
      - name: Save compiler cache
        if: always() && steps.ccache.outputs.cache-primary-key != '' && steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/rackpy-ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}
      - if: always()
        name: Collect Rack logs
        run: |
          mkdir -p reports/rack-logs
          cd "$RUNNER_TEMP/pytest" 2>/dev/null && find . -name log.txt -exec cp --parents {} "$GITHUB_WORKSPACE/reports/rack-logs/" \; || true
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-win-x64-${{ matrix.suite.name }}-reports
          path: reports/
          retention-days: 14
          if-no-files-found: ignore

  macos:
    name: macOS ${{ matrix.platform }} ${{ matrix.suite.name }} suite, native build, CTest, unit and Rack host tests
    # RP-40. Native builds with the runner's AppleClang (one architecture each), the native tests
