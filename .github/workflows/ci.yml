            suite: { name: coverage, paths: "tests/coverage" }
          - runner: macos-15-intel
            platform: mac-x64
            suite: { name: dsp, paths: "tests/dsp tests/simd tests/values tests/engine tests/io tests/laboratory" }
          - runner: macos-15-intel
            platform: mac-x64
            suite: { name: examples, paths: "tests/examples" }
          - runner: macos-15-intel
            platform: mac-x64
