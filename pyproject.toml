[project]
name = "rackpy"
version = "0.0.0.dev0"
description = "Python for VCV Rack plugins (development skeleton; no Rack API is bound yet)"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.14"
authors = [{ name = "RackPy contributors" }]
classifiers = ["Development Status :: 1 - Planning", "Private :: Do Not Upload"]
dependencies = []

[project.urls]
Source = "https://github.com/feoh/RackPy"

[dependency-groups]
dev = [
    "clang==21.1.7",       # libclang bindings for bin/inventory_sdk.py and its tests
    "cyclopts>=5.2,<6",    # bin/ utilities
    "mypy>=1.18",
    "pybind11==3.1.0",     # headers and CMake config for the native host (ADR 002)
    "pytest>=8.4",
    "ruff>=0.14",
]

docs = [
    "furo",              # accessible theme with light and dark modes
    "myst-parser",       # the site is written in Markdown
    "sphinx",
    "sphinx-autoapi",    # documents src/rackpy by parsing it; nothing is imported
    "types-docutils",    # for strict mypy over docs/_ext
]

[build-system]
requires = ["uv_build>=0.9.18,<0.10"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.9.18"
default-groups = ["dev", "docs"]
# Resolve as of a fixed date, like the bin/ scripts; uv.lock pins the result.
exclude-newer = "2026-10-21T00:00:00Z"

[tool.ruff]
line-length = 120
target-version = "py314"
# bin/ utilities are Python scripts without a .py suffix.
extend-include = ["bin/*"]
extend-exclude = ["upstream", "tests/inventory/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PTH", "PL"]
ignore = [
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004",  # complexity limits do not suit the extraction tools
    "PLC0415",  # imports inside functions are deliberate in tests and tools
    "RUF001",   # Rack's own strings contain ⌘ and similar characters
]

[tool.mypy]
strict = true
python_version = "3.14"
mypy_path = ["typings", "src", "docs/_ext", "bin"]
explicit_package_bases = true
# bin/ utilities without a .py suffix all map to module __main__, so
# `bin/rackpy-dev typecheck` runs mypy on each of them separately.
files = [
    "src",
    "tests",
    "docs/conf.py",
    "docs/_ext",
    "bin/inventory_sdk.py",
    "bin/binding_manifest.py",
    "bin/check_coverage.py",
    "bin/generate_bindings.py",
]
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
markers = [
    "unit: pure Python; no SDK, compiler or Rack needed",
    "native: builds or runs native code against the pinned Rack SDK, outside Rack",
    "inventory: libclang inventory of the SDK surface (bin/inventory_sdk.py)",
    "host: runs the real Rack Free host (Linux x86_64)",
    "gui: runs windowed Rack inside Xvfb (needs xvfb-run)",
    "dist: builds with the official Rack plugin toolchain (bin/rack-toolchain build first)",
    "docs: builds the documentation site or runs its snippets",
]
