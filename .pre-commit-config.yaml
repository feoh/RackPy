repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        # The generated SDK inventory is about 1.1 MB, stored one entry per line
        # so diffs stay reviewable. bin/inventory_sdk.py check verifies it.
        exclude: ^upstream/api-surface\.json$
      - id: trailing-whitespace
      - id: end-of-file-fixer
